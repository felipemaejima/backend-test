root = "."
tmp_dir = "tmp"

[build]
  # -buildvcs=false: o .git vem por bind mount e pertence ao usuário do host,
  # o que o git dentro do container recusa ("dubious ownership").
  cmd = "go build -buildvcs=false -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["tmp", "vendor", "migrations", ".git"]
  exclude_regex = ["_test\\.go"]
  delay = 300
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
